<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>POPS — AI Unit from When the Earth Had a Moon</title>
<meta name="description" content="Talk to POPS, the sardonic AI from A.M. Cunning's sci-fi novel When the Earth Had a Moon. If you think you can handle it.">
<link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Orbitron:wght@400;700;900&display=swap" rel="stylesheet">
<style>
  :root {
    --green: #00ff88;
    --green-dim: #00cc66;
    --green-dark: #003322;
    --green-faint: #001a0f;
    --amber: #ffaa00;
    --bg: #020d06;
    --border: #00ff8844;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg);
    font-family: 'Share Tech Mono', monospace;
    color: var(--green);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  /* Scanlines */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background: repeating-linear-gradient(
      0deg, transparent, transparent 2px,
      rgba(0,0,0,0.07) 2px, rgba(0,0,0,0.07) 4px
    );
    pointer-events: none;
    z-index: 999;
  }

  /* Background grid */
  body::after {
    content: '';
    position: fixed;
    inset: 0;
    background-image:
      linear-gradient(rgba(0,255,136,0.03) 1px, transparent 1px),
      linear-gradient(90deg, rgba(0,255,136,0.03) 1px, transparent 1px);
    background-size: 40px 40px;
    pointer-events: none;
  }

  .page {
    display: flex;
    flex-direction: column;
    height: 100vh;
    max-width: 800px;
    margin: 0 auto;
    width: 100%;
    padding: 24px 20px 16px;
    gap: 0;
    position: relative;
    z-index: 1;
  }

  /* Top banner */
  .banner {
    text-align: center;
    margin-bottom: 20px;
  }

  .banner-eyebrow {
    font-size: 0.6rem;
    letter-spacing: 0.3em;
    color: #00ff8844;
    text-transform: uppercase;
    margin-bottom: 6px;
  }

  .banner h1 {
    font-family: 'Orbitron', sans-serif;
    font-size: clamp(2.5rem, 8vw, 4.5rem);
    font-weight: 900;
    letter-spacing: 0.3em;
    color: var(--green);
    text-shadow: 0 0 20px var(--green), 0 0 60px rgba(0,255,136,0.2);
    line-height: 1;
  }

  .banner-sub {
    font-size: 0.65rem;
    letter-spacing: 0.2em;
    color: var(--amber);
    margin-top: 6px;
    text-transform: uppercase;
  }

  /* Chat area */
  .chat-frame {
    flex: 1;
    display: flex;
    flex-direction: column;
    border: 1px solid var(--border);
    border-radius: 4px;
    overflow: hidden;
    background: rgba(0,10,5,0.8);
    min-height: 0;
  }

  .chat-header {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 12px 16px;
    border-bottom: 1px solid var(--border);
    background: var(--green-faint);
  }

  .pops-avatar {
    width: 38px;
    height: 38px;
    flex-shrink: 0;
    filter: drop-shadow(0 0 6px var(--green));
    animation: pulse 3s ease-in-out infinite;
  }

  @keyframes pulse {
    0%, 100% { filter: drop-shadow(0 0 6px var(--green)); }
    50% { filter: drop-shadow(0 0 14px var(--green)); }
  }

  .chat-header-info {
    flex: 1;
  }

  .chat-header-info strong {
    display: block;
    font-family: 'Orbitron', sans-serif;
    font-size: 0.75rem;
    letter-spacing: 0.15em;
    color: var(--green);
  }

  .chat-header-info span {
    font-size: 0.6rem;
    color: #00ff8855;
    letter-spacing: 0.1em;
  }

  .online-badge {
    display: flex;
    align-items: center;
    gap: 5px;
    font-size: 0.6rem;
    color: var(--green-dim);
    letter-spacing: 0.1em;
  }

  .dot {
    width: 5px;
    height: 5px;
    background: var(--green);
    border-radius: 50%;
    box-shadow: 0 0 5px var(--green);
    animation: blink 2s step-end infinite;
  }

  @keyframes blink {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.2; }
  }

  .messages {
    flex: 1;
    overflow-y: auto;
    padding: 16px;
    display: flex;
    flex-direction: column;
    gap: 12px;
    scrollbar-width: thin;
    scrollbar-color: var(--green-dark) transparent;
  }

  .messages::-webkit-scrollbar { width: 3px; }
  .messages::-webkit-scrollbar-thumb { background: var(--green-dark); }

  .message {
    display: flex;
    flex-direction: column;
    gap: 3px;
    animation: slideIn 0.25s ease;
  }

  @keyframes slideIn {
    from { opacity: 0; transform: translateY(5px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .msg-label {
    font-size: 0.55rem;
    letter-spacing: 0.2em;
    text-transform: uppercase;
  }

  .message.pops .msg-label { color: var(--amber); }
  .message.user .msg-label { color: #00ff8844; align-self: flex-end; }

  .bubble {
    padding: 10px 14px;
    font-size: 0.875rem;
    line-height: 1.65;
    border-radius: 2px;
    max-width: 85%;
  }

  .message.pops .bubble {
    background: rgba(0,255,136,0.04);
    border: 1px solid var(--border);
    border-left: 3px solid var(--amber);
    color: var(--green);
    align-self: flex-start;
  }

  .message.user .bubble {
    background: rgba(0,255,136,0.02);
    border: 1px solid rgba(0,255,136,0.1);
    border-right: 2px solid var(--green-dim);
    color: var(--green-dim);
    align-self: flex-end;
    text-align: right;
  }

  .typing-indicator {
    display: flex;
    gap: 4px;
    align-items: center;
    padding: 10px 14px;
    background: rgba(0,255,136,0.04);
    border: 1px solid var(--border);
    border-left: 3px solid var(--amber);
    width: fit-content;
    border-radius: 2px;
  }

  .typing-indicator span {
    width: 5px;
    height: 5px;
    background: var(--amber);
    border-radius: 50%;
    animation: bounce 1.2s ease-in-out infinite;
  }
  .typing-indicator span:nth-child(2) { animation-delay: 0.2s; }
  .typing-indicator span:nth-child(3) { animation-delay: 0.4s; }

  @keyframes bounce {
    0%, 80%, 100% { transform: scale(0.8); opacity: 0.3; }
    40% { transform: scale(1.2); opacity: 1; }
  }

  .input-area {
    border-top: 1px solid var(--border);
    padding: 12px 16px;
    display: flex;
    gap: 10px;
    background: var(--green-faint);
  }

  .input-area input {
    flex: 1;
    background: rgba(0,255,136,0.03);
    border: 1px solid rgba(0,255,136,0.2);
    color: var(--green);
    font-family: 'Share Tech Mono', monospace;
    font-size: 0.85rem;
    padding: 9px 12px;
    border-radius: 2px;
    outline: none;
    transition: border-color 0.2s, box-shadow 0.2s;
  }

  .input-area input:focus {
    border-color: var(--green);
    box-shadow: 0 0 12px rgba(0,255,136,0.1);
  }

  .input-area input::placeholder { color: rgba(0,255,136,0.2); }

  .input-area button {
    background: transparent;
    border: 1px solid var(--green-dim);
    color: var(--green);
    font-family: 'Orbitron', sans-serif;
    font-size: 0.6rem;
    letter-spacing: 0.15em;
    padding: 9px 16px;
    cursor: pointer;
    border-radius: 2px;
    text-transform: uppercase;
    transition: all 0.2s;
    white-space: nowrap;
  }

  .input-area button:hover:not(:disabled) {
    background: var(--green-dark);
    border-color: var(--green);
    box-shadow: 0 0 12px rgba(0,255,136,0.15);
  }

  .input-area button:disabled { opacity: 0.35; cursor: not-allowed; }

  .footer {
    text-align: center;
    padding: 10px 0 0;
    font-size: 0.58rem;
    color: rgba(0,255,136,0.15);
    letter-spacing: 0.12em;
  }

  .footer a { color: rgba(0,255,136,0.25); text-decoration: none; }
  .footer a:hover { color: var(--green-dim); }
</style>
</head>
<body>
<div class="page">
  <div class="banner">
    <div class="banner-eyebrow">A.M. Cunning presents</div>
    <h1>P.O.P.S</h1>
    <div class="banner-sub">Talk to the AI — if you think you can handle it</div>
  </div>

  <div class="chat-frame">
    <div class="chat-header">
      <svg class="pops-avatar" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
        <rect x="15" y="20" width="70" height="65" rx="10" fill="#003322" stroke="#00ff88" stroke-width="2"/>
        <rect x="25" y="35" width="20" height="14" rx="3" fill="#001a0f" stroke="#ffaa00" stroke-width="1.5"/>
        <rect x="55" y="35" width="20" height="14" rx="3" fill="#001a0f" stroke="#ffaa00" stroke-width="1.5"/>
        <circle cx="35" cy="42" r="4" fill="#00ff88" opacity="0.9"/>
        <circle cx="65" cy="42" r="4" fill="#00ff88" opacity="0.9"/>
        <line x1="45" y1="42" x2="55" y2="42" stroke="#ffaa00" stroke-width="1.5"/>
        <path d="M35 62 Q50 58 65 62" stroke="#00ff88" stroke-width="1.5" fill="none"/>
        <rect x="42" y="15" width="16" height="6" rx="2" fill="#003322" stroke="#00ff88" stroke-width="1.5"/>
        <circle cx="50" cy="12" r="3" fill="#00ff88" opacity="0.6"/>
        <rect x="8" y="38" width="8" height="16" rx="2" fill="#003322" stroke="#00ff88" stroke-width="1.5"/>
        <rect x="84" y="38" width="8" height="16" rx="2" fill="#003322" stroke="#00ff88" stroke-width="1.5"/>
      </svg>
      <div class="chat-header-info">
        <strong>P.O.P.S — AI UNIT</strong>
        <span>WHEN THE EARTH HAD A MOON · LUNAR BASE PROTOCOL</span>
      </div>
      <div class="online-badge">
        <div class="dot"></div>
        ACTIVE
      </div>
    </div>

    <div class="messages" id="messages"></div>

    <div class="input-area">
      <input type="text" id="userInput" placeholder="Ask POPS something... if you must." />
      <button id="sendBtn" onclick="sendMessage()">TRANSMIT</button>
    </div>
  </div>

  <div class="footer">
    POPS is a character from <a href="https://amcunning.github.io" target="_blank">WHEN THE EARTH HAD A MOON</a> by A.M. Cunning &nbsp;·&nbsp; <a href="https://amcunning.github.io" target="_blank">Get the book</a>
  </div>
</div>

<script>
  // IMPORTANT: Replace this with your Render backend URL after deployment
  const BACKEND_URL = 'https://pops-backend-7679.onrender.com/chat';

  const conversationHistory = [];

  function addMessage(role, text) {
    const messages = document.getElementById('messages');
    const div = document.createElement('div');
    div.className = `message ${role}`;
    const label = role === 'pops' ? 'P.O.P.S' : 'YOU';
    div.innerHTML = `<div class="msg-label">${label}</div><div class="bubble">${text}</div>`;
    messages.appendChild(div);
    messages.scrollTop = messages.scrollHeight;
  }

  function showTyping() {
    const messages = document.getElementById('messages');
    const div = document.createElement('div');
    div.id = 'typing';
    div.className = 'message pops';
    div.innerHTML = `<div class="msg-label">P.O.P.S</div><div class="typing-indicator"><span></span><span></span><span></span></div>`;
    messages.appendChild(div);
    messages.scrollTop = messages.scrollHeight;
  }

  function removeTyping() {
    const t = document.getElementById('typing');
    if (t) t.remove();
  }

  async function sendMessage() {
    const input = document.getElementById('userInput');
    const btn = document.getElementById('sendBtn');
    const text = input.value.trim();
    if (!text) return;

    addMessage('user', text);
    conversationHistory.push({ role: 'user', content: text });
    input.value = '';
    btn.disabled = true;
    showTyping();

    try {
      const response = await fetch(BACKEND_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ messages: conversationHistory })
      });

      const data = await response.json();
      removeTyping();

      const reply = data.reply || "...Connection interrupted. Typical.";
      conversationHistory.push({ role: 'assistant', content: reply });
      addMessage('pops', reply);
    } catch (err) {
      removeTyping();
      addMessage('pops', "Signal lost. Human infrastructure, as usual.");
    }

    btn.disabled = false;
    input.focus();
  }

  document.getElementById('userInput').addEventListener('keydown', e => {
    if (e.key === 'Enter') sendMessage();
  });

  window.addEventListener('load', () => {
    setTimeout(() => {
      const greeting = "You're welcome.";
      conversationHistory.push({ role: 'assistant', content: greeting });
      addMessage('pops', greeting);
    }, 700);
  });
</script>
</body>
</html>
